<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 205" width="768" height="205" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">ZELICLOUD project delivery flow</title>
  <desc id="desc">An animated flow from business context to product modeling, multi-platform delivery and continuous iteration.</desc>

  <rect width="768" height="205" rx="18" fill="#0B1220" />
  <g transform="scale(0.64)">
  <path d="M48 86H1152" stroke="#233149" stroke-width="1" />
  <path d="M48 86H1152" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 24" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.6s" repeatCount="indefinite" />
  </path>

  <text x="48" y="50" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" letter-spacing="1">DELIVERY FLOW</text>
  <text x="1152" y="50" text-anchor="end" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">业务到产品 · 持续运转</text>

  <path d="M150 156H1050" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M150 156H1050" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 22" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-81" dur="1.8s" repeatCount="indefinite" />
  </path>

  <g fill="#38BDF8">
    <circle r="5">
      <animateMotion path="M150 156H1050" dur="4.8s" repeatCount="indefinite" />
    </circle>
    <circle r="4" opacity="0.65">
      <animateMotion path="M150 156H1050" dur="4.8s" begin="-2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <g transform="translate(150 156)">
    <circle r="22" fill="#0B1220" stroke="#38BDF8" stroke-width="2" />
    <circle r="8" fill="#38BDF8">
      <animate attributeName="r" values="8;14;8" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-42" text-anchor="middle" fill="#E0F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">业务现场</text>
    <text x="0" y="56" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">需求 · 角色 · 流程</text>
  </g>

  <g transform="translate(450 156)">
    <circle r="22" fill="#0B1220" stroke="#2DD4BF" stroke-width="2" />
    <circle r="8" fill="#2DD4BF">
      <animate attributeName="r" values="8;14;8" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-42" text-anchor="middle" fill="#CCFBF1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">产品建模</text>
    <text x="0" y="56" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">服务 · 数据 · 权限</text>
  </g>

  <g transform="translate(750 156)">
    <circle r="22" fill="#0B1220" stroke="#FBBF24" stroke-width="2" />
    <circle r="8" fill="#FBBF24">
      <animate attributeName="r" values="8;14;8" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-42" text-anchor="middle" fill="#FEF3C7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">多端交付</text>
    <text x="0" y="56" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Web · App · 小程序</text>
  </g>

  <g transform="translate(1050 156)">
    <circle r="22" fill="#0B1220" stroke="#4ADE80" stroke-width="2" />
    <circle r="8" fill="#4ADE80">
      <animate attributeName="r" values="8;14;8" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-42" text-anchor="middle" fill="#DCFCE7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">持续迭代</text>
    <text x="0" y="56" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">文档 · 反馈 · 发布</text>
  </g>

  <text x="48" y="276" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="1">IN MOTION</text>
  <text x="182" y="276" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">WorkMesh</text>
  <text x="340" y="276" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Martial</text>
  <text x="470" y="276" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">PropFlow</text>
  <text x="612" y="276" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Medical</text>
  <text x="750" y="276" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">MES</text>
  <path d="M910 271H1152" stroke="#1F2937" stroke-width="5" stroke-linecap="round" />
  <path d="M910 271H1038" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="1.4s" repeatCount="indefinite" />
  </path>
  </g>
</svg>
